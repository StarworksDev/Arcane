[package]
# Underscore, not hyphen: the crate name IS the shipped binary's name
# (arcane_hub.exe), and the user wants the underscore form on disk.
name = "arcane_hub"
version = "0.1.0"
description = "Arcane Hub -- engine and project launcher"
authors = ["Starworks"]
edition = "2021"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name, which
# otherwise conflicts on Windows (rust-lang/cargo#8519).
name = "arcane_hub_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# tray-icon: the default launch behaviour parks the Hub in the system tray
# while editors run -- click to bring it back, right-click for quick actions.
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
# ONE Hub per user, enforced: a second launch focuses the existing window
# instead of starting a rival process. Two Hubs would share the .archub state
# files last-writer-wins -- the atomic writes prevent corruption, and
# state::mutate's lock prevents lost updates only WITHIN one process -- and a
# launcher's second launch means "show me the Hub" anyway (Unity Hub and the
# Epic launcher both behave this way).
tauri-plugin-single-instance = "2"
# Remember window size/position/maximized across sessions (every comparable
# launcher does). NOT hand-rolled: multi-monitor + DPI + monitor-unplugged
# restore is exactly the edge-case swamp a maintained plugin exists for.
# Note: it persists one JSON in the app-config dir (%APPDATA%\dev.starworks.
# arcanehub), not our .archub tree -- window geometry is chrome, not user
# data, and losing it costs one resize.
tauri-plugin-window-state = "2"
# Raw Win32 for two launcher jobs no plugin covers: claiming the taskbar
# AppUserModelID the editor shares (grouping is by AUMID, NOT by process
# parentage), and focusing a running editor's window when its project is
# launched a second time.
windows-sys = { version = "0.60", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
serde = { version = "1", features = ["derive"] }
# preserve_order: rename_project rewrites a project's .arcproj in place. Without
# it serde_json's object is a BTreeMap, so a round-trip alphabetises every key
# and the Hub would hand back a manifest reordered top to bottom for a one-field
# edit -- a diff the user did not ask for in a file they may have in git.
serde_json = { version = "1", features = ["preserve_order"] }
# Project cover thumbnails travel to the webview as data: URLs -- the CSP in
# tauri.conf.json allows `img-src data:` but no file or asset protocol, and a
# couple of hundred KB of PNG per card does not justify opening one.
base64 = "0.22"
# Fresh project identities: Duplicate regenerates the manifest's guid (a copy
# is a NEW project) and create_project stamps one at birth. v4-only, matching
# the engine's own Guid::Generate; already in tauri's dependency tree.
uuid = { version = "1", features = ["v4"] }
# HKCU registry writes for the .arcproj association self-heal (assoc.rs).
# Exists because the NSIS-written command was UNQUOTED, and an unquoted
# path through "...\AppData\Local\Arcane" -- our own data dir -- makes the
# shell try to execute a directory ("This app can't run on your PC").
winreg = "0.55"
# Deleting a project goes to the RECYCLE BIN, not to remove_dir_all. A launcher
# that can erase months of work on a mis-click should hand the user the same
# undo Explorer would; this wraps the Windows shell's IFileOperation, which is
# what puts the folder somewhere it can be restored from.
trash = "5"
